# LiteLLM proxy config — Auto Router (option 3), self-hosted models over Tailscale
# Requires LiteLLM >= v1.94.0 (auto routing is beta; keys may change).
# Clients call ONE model name: "smart-router". LiteLLM classifies each
# request and sends it to the model assigned to that tier ("role").
#
# The LiteLLM host must be joined to the same tailnet as the GPU boxes.
# Hostnames below are PLACEHOLDER MagicDNS names — replace
# "tailnet-1234.ts.net" with your tailnet's domain (or use 100.x.y.z IPs).
# 
# This means you may need to update your Tailscale ACLs if you're going to use 
# LiteLLM. If you hosted LiteLLM on your `dev` machine, this should "just work".
#
#   gpu-box-1  : vLLM   (port 8000)  — large reasoning model
#   gpu-box-2  : vLLM   (port 8000)  — coding model
#   mini-1     : Ollama (port 11434) — small / general models + embeddings
#   mini-2     : Ollama (port 11434) — second small-model node (pool)
#
# Run:  litellm --config config.yaml
# Env:  VLLM_API_KEY (whatever you passed to `vllm serve --api-key`), LITELLM_MASTER_KEY

model_list:
  # ---------- Responder (SIMPLE): small, fast models on Ollama ----------
  - model_name: qwen3-8b-mini1
    litellm_params:
      model: ollama_chat/qwen3:8b                 # ollama_chat = /api/chat endpoint
      api_base: http://mini-1.tailnet-1234.ts.net:11434
    model_info:
      max_input_tokens: 32768

  - model_name: qwen3-8b-mini2
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://mini-2.tailnet-1234.ts.net:11434
    model_info:
      max_input_tokens: 32768

  # ---------- Generalist (MEDIUM): mid-size model on Ollama ----------
  - model_name: gemma3-27b
    litellm_params:
      model: ollama_chat/gemma3:27b
      api_base: http://mini-1.tailnet-1234.ts.net:11434
    model_info:
      max_input_tokens: 131072

  # ---------- Coder (COMPLEX): coding model on vLLM ----------
  - model_name: qwen3-coder-30b
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3-Coder-30B-A3B-Instruct   # must match vLLM's served model name
      api_base: http://gpu-box-2.tailnet-1234.ts.net:8000/v1
      api_key: os.environ/VLLM_API_KEY
    model_info:
      max_input_tokens: 131072

  # ---------- Architect (REASONING): large reasoning model on vLLM ----------
  - model_name: gpt-oss-120b
    litellm_params:
      model: hosted_vllm/openai/gpt-oss-120b
      api_base: http://gpu-box-1.tailnet-1234.ts.net:8000/v1
      api_key: os.environ/VLLM_API_KEY
    model_info:
      max_input_tokens: 131072

  # ---------- Embeddings for semantic keyword matching (Ollama) ----------
  - model_name: nomic-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://mini-1.tailnet-1234.ts.net:11434
    model_info:
      mode: embedding

  # ---------- The Auto Router ----------
  - model_name: smart-router
    litellm_params:
      model: auto_router/complexity_router
      drop_params: true               # strip params a routed model doesn't support

      complexity_router_config:
        # Tier -> model. A string pins one model; a list is a pool.
        tiers:
          SIMPLE:    ["qwen3-8b-mini1", "qwen3-8b-mini2"]   # spread across both minis
          MEDIUM:    gemma3-27b
          COMPLEX:   qwen3-coder-30b
          REASONING: gpt-oss-120b

        # Friendly role names shown in the UI / logs
        tier_labels:
          SIMPLE:    "Responder"
          MEDIUM:    "Generalist"
          COMPLEX:   "Coder"
          REASONING: "Architect"

        # ----- Classifier -----
        # heuristic (default, free) | llm | jev | custom
        # Uses a small local model, so classification has no per-token cost.
        classifier_type: llm
        classifier_llm_config:
          model: qwen3-8b-mini1
          timeout_ms: 3000                      # local hops can be slower than hosted APIs
        classifier_fallback: heuristic          # if the classifier errors/times out
        classifier_context_window_size: 3       # look at the last 3 turns
        classifier_context_budget_chars: 8000
        classification_mode: user_turn          # re-classify only on new user turns

        # ----- Role rules (run BEFORE the classifier; highest tier wins) -----
        keyword_tier_rules:
          - keywords: ["hi", "hello", "thanks", "thank you"]
            tier: SIMPLE
          - keywords: ["summarize", "rewrite", "translate", "draft an email"]
            tier: MEDIUM
          - keywords: ["write code", "refactor", "unit test", "stack trace", "debug", "pull request"]
            tier: COMPLEX
          - keywords: ["architecture", "design a system", "threat model", "prove", "trade-offs"]
            tier: REASONING

        # Match keywords by meaning, not just literal text
        semantic_keyword_matching: true
        embedding_model: nomic-embed
        match_threshold: 0.5

        # Domain terms that push the heuristic scorer toward harder tiers
        custom_technical_keywords: [kubernetes, terraform, kafka, postgresql, oauth]

        # Ignore injected tool/harness text when classifying
        reminder_markers: ["<system-reminder>", "</system-reminder>"]

        # Bump to a larger-context tier if the prompt won't fit (>= v1.96.0).
        # Relies on the max_input_tokens values set in model_info above.
        enable_context_window_escalation: true
        context_window_escalation_buffer: 0.95

        # Learn which model in a pooled tier performs best
        adaptive: true

        # Keep a conversation on the same model (helps KV/prefix caching)
        session_affinity: true
        session_affinity_ttl_seconds: 3600

      # Used when nothing matches or routing fails
      complexity_router_default_model: gemma3-27b

router_settings:
  num_retries: 2
  timeout: 300                        # big local models can take a while
  fallbacks:                          # if a box is offline / off the tailnet
    - gpt-oss-120b: [qwen3-coder-30b]
    - qwen3-coder-30b: [gemma3-27b]
    - gemma3-27b: [qwen3-8b-mini1, qwen3-8b-mini2]
    - qwen3-8b-mini1: [qwen3-8b-mini2]
    - qwen3-8b-mini2: [qwen3-8b-mini1]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY